<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px 16px;color:#222}h1{font-size:22px;text-align:center}nav{display:flex;gap:8px;justify-content:center;margin:16px 0}nav button{border:1px solid #ddd;background:#fff;padding:8px 16px;border-radius:99px;cursor:pointer}nav button.on{background:#222;color:#fff}textarea{width:100%;min-height:120px;padding:10px;border:1px solid #ddd;border-radius:8px;resize:vertical}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row button{padding:8px 14px;border:0;border-radius:8px;background:#222;color:#fff}.row button.ghost{background:#eee;color:#222}pre{white-space:pre-wrap;word-break:break-all;background:#f6f6f6;border-radius:8px;padding:12px;min-height:60px;max-height:260px;overflow:auto}#drop{border:2px dashed #ccc;border-radius:12px;padding:28px;text-align:center;color:#666}#drop.over{border-color:#222;color:#222}#preview{max-width:100%;max-height:240px;display:none;margin:12px auto;border-radius:8px}.muted{color:#666;font-size:14px;text-align:center}</style></head><body><nav><button id="tText" class="on" onclick="show('text')">文字</button><button id="tImg" onclick="show('img')">圖片</button></nav><section id="pText"><textarea id="in" placeholder="輸入文字，或貼上 Base64…"></textarea><div class="row"><button onclick="enc()">編碼</button><button onclick="dec()">解碼</button><button class="ghost" onclick="copyOut()">複製結果</button><button class="ghost" onclick="clearAll()">清除</button></div><pre id="out"></pre></section><section id="pImg" hidden><div id="drop">拖放圖片到這裡，或 <label style="color:#222;text-decoration:underline;cursor:pointer">選擇檔案<input type="file" id="file" accept="image/*" hidden></label></div><img id="preview" alt=""><p class="muted" id="info"></p><div class="row" style="justify-content:center"><button class="ghost" onclick="copyOut()">複製 Base64</button></div><pre id="out2"></pre></section><script>const $=id=>document.getElementById(id);function show(m){$('pText').hidden=m!=='text';$('pImg').hidden=m!=='img';$('tText').className=m==='text'?'on':'';$('tImg').className=m==='img'?'on':''}function enc(){try{$('out').textContent=btoa(String.fromCharCode(...new TextEncoder().encode($('in').value)))}catch(e){$('out').textContent='編碼失敗'}}function dec(){try{$('out').textContent=new TextDecoder().decode(Uint8Array.from(atob($('in').value.trim()),c=>c.charCodeAt(0)))}catch(e){$('out').textContent='解碼失敗：請確認是有效的 Base64'}}function copyOut(){const t=($('pText').hidden?$('out2'):$('out')).textContent;if(!t)return;navigator.clipboard.writeText(t).catch(()=>{})}function clearAll(){$('in').value='';$('out').textContent=''}function handle(f){if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block';$('out2').textContent=r.result;$('info').textContent=f.name+' · '+(f.size/1024).toFixed(1)+' KB'};r.readAsDataURL(f)}const d=$('drop');['dragover','dragenter'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('over')}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('over')}));d.addEventListener('drop',e=>handle(e.dataTransfer.files[0]));$('file').addEventListener('change',e=>handle(e.target.files[0]));</script></body></html>
