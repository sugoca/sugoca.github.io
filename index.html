<!doctype html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Tools</title>
<style>
:root{--bg:#fcfcfa;--card:#fff;--text:#111;--line:#e9e9e6;--muted:#9a9a96}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top input{width:200px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;outline:0}
.top input:focus{border-color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
a{ background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;text-decoration:none;color:var(--text);font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.12s;display:block;text-align:center}
a:hover{border-color:#111;transform:translateY(-1px)}
footer{margin-top:28px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:12px}
code{background:#f3f3ef;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px}
@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><input id="q" placeholder="搜尋…"></div>
<div class="grid" id="g"></div>
</div>
<script>
// === 在這裡新增，只改這裡 ===
// 格式: {name, url}
const LINKS = [
{name:"Github Edit",url:"https://github.com/sugoca/sugoca.github.io"},
{name:"TOTP",url:"https://sugoca.github.io/totp.html"},
{name:"ReURL",url:"https://sugoca.github.io/reurl.html?u="},
{name:"ProtectedText",url:"https://www.protectedtext.com/fdf"},
{name:"Calc All",url:"https://sugoca.github.io/allcalc.html"},
{name:"TG Push",url:"https://sugoca.github.io/tgpush.html?"},
{name:"Thumbsnap",url:"https://sugoca.github.io/a/img.html"},
{name:"bingfong",url:"https://image.bingfong.com/"},
{name:"LessPass",url:"https://sugoca.github.io/lesspass"},
{name:"Pic To Base64",url:"https://sugoca.github.io/pic2base64.html"},
{name:"Base64",url:"https://sugoca.github.io/base64.html"},
{name:"Password Generator",url:"https://sugoca.github.io/pwg.html"},
{name:"Crypt",url:"https://sugoca.github.io/crypt.html"},
{name:"Hat.sh",url:"https://myhatsh.vercel.app/"},
{name:"Cloaker",url:"https://mycloaker.vercel.app/"},
{name:"Mycroft",url:"https://mycroftproject.com/"},
{name:"VPN",url:"https://sugoca.github.io/vpn.htm"},
];
const $g=document.getElementById('g'),$q=document.getElementById('q');
function render(){
 const q=$q.value.toLowerCase().trim();
 const list=q?LINKS.filter(l=>l.name.toLowerCase().includes(q)):LINKS;
 $g.innerHTML=list.map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${l.name}</a>`).join('') || `<div style="color:var(--muted);font-size:13px;padding:10px">找不到</div>`;
}
$q.addEventListener('input',render);render();
</script>
</body>
</html>
